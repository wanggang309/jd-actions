name: JD Sign

on:
  # 每天北京时间 07:15 触发（UTC 23:15）
  schedule:
    - cron: '15 23 * * *'
  workflow_dispatch:
  watch:
    types: [started]

env:
  # 多账号：把 JD_COOKIE 和 JD_COOKIE2/3 合并成一个字符串，用 & 分隔
  # 如果你只有一个账号，只配 JD_COOKIE 即可，后两个为空不会报错
  JD_COOKIE: ${{ secrets.JD_COOKIE }}${{ secrets.JD_COOKIE2 != '' && format('&{0}', secrets.JD_COOKIE2) || '' }}${{ secrets.JD_COOKIE3 != '' && format('&{0}', secrets.JD_COOKIE3) || '' }}
  # 随机延迟上限（分钟），0 关闭。Actions 里别设太大，避免超时
  JD_DELAY_MAX: '5'

jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install axios
        # 脚本的 Node 分支依赖 axios
        run: npm install axios

      - name: Run JD sign script
        run: node jd_sign.js

      - name: Upload result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sign-result
          path: |
            ./CookieSet.json
            ./result.txt
            ./error.txt
          if-no-files-found: ignore
